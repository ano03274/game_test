<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블랙우드 저택의 자정 - 방탈출 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #d4af37;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 562px;
            background-image: url('haunted_victorian_mansion_bg.png');
            background-size: cover;
            background-position: center;
            border: 4px solid #3a2817;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        /* [핵심 수정] 이미지 촛불 빛까지 감추는 디밍 & 무채색 오버레이 */
        #darkness-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.45);
            backdrop-filter: brightness(0.38) grayscale(0.5);
            /* 촛불 빛 감추기 & 스산한 어둠 연출 */
            -webkit-backdrop-filter: brightness(0.38) grayscale(0.5);
            transition: all 1.8s ease;
            pointer-events: none;
            z-index: 5;
        }

        /* [핵심 수정] 촛불 불을 붙인 후: 빛이 살아나고 방이 환해짐 */
        #darkness-overlay.lit {
            background-color: rgba(0, 0, 0, 0.0);
            backdrop-filter: brightness(1.25) grayscale(0);
            /* 따뜻한 불빛 활성화 & 밝기 향상 */
            -webkit-backdrop-filter: brightness(1.25) grayscale(0);
        }

        /* 핫스팟 (클릭 및 호버 영역) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .hotspot:hover {
            border: 2px solid #ffd700;
            background-color: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        /* 클릭 영역 위치 설정 */
        #hs-table {
            top: 62%;
            left: 2%;
            width: 22%;
            height: 35%;
        }

        #hs-fireplace {
            top: 50%;
            left: 15%;
            width: 14%;
            height: 28%;
        }

        #hs-mirror {
            top: 30%;
            left: 1%;
            width: 13%;
            height: 48%;
        }

        #hs-portrait-right {
            top: 35%;
            left: 71%;
            width: 10%;
            height: 18%;
        }

        #hs-clock {
            top: 33%;
            left: 60%;
            width: 10%;
            height: 50%;
        }

        #hs-door {
            top: 20%;
            left: 77%;
            width: 20%;
            height: 60%;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(15, 10, 5, 0.85));
            border-top: 2px solid #5a422a;
            display: flex;
            padding: 10px;
            z-index: 20;
        }

        #textbox {
            flex: 2;
            padding: 10px;
            color: #f0e6d2;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            border-right: 1px solid #4a3825;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
        }

        #inventory {
            flex: 1;
            display: flex;
            gap: 10px;
            padding-left: 10px;
            align-items: center;
        }

        .inv-slot {
            width: 55px;
            height: 55px;
            border: 2px solid #5a422a;
            background: rgba(20, 15, 10, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            border-radius: 4px;
        }

        .inv-slot.selected {
            border-color: #ffd700;
            box-shadow: 0 0 10px #ffd700;
            background: rgba(50, 35, 15, 0.9);
        }

        /* 모달 팝업 디자인 */
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            background: #140f0b;
            border: 2px solid #8c6d3f;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
            z-index: 30;
            color: #d4af37;
            text-align: center;
            border-radius: 6px;
        }

        .modal h3 {
            margin-bottom: 10px;
            font-size: 18px;
            border-bottom: 1px solid #4a3825;
            padding-bottom: 5px;
        }

        .modal p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .modal input {
            width: 80%;
            padding: 8px;
            background: #080604;
            border: 1px solid #665035;
            color: #fff;
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .modal button {
            padding: 7px 16px;
            background: #3a2817;
            color: #ffd700;
            border: 1px solid #665035;
            cursor: pointer;
            margin: 0 4px;
            font-weight: bold;
        }

        .modal button:hover {
            background: #5a3e23;
        }

        /* 엔딩 화면 */
        #ending-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #d4af37;
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        #ending-screen h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #ffd700;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- 어둠 오버레이 -->
        <div id="darkness-overlay"></div>

        <!-- 핫스팟 클릭 영역 -->
        <div id="hs-table" class="hotspot" onclick="clickTable()" title="탁자"></div>
        <div id="hs-fireplace" class="hotspot" onclick="clickFireplace()" title="벽난로"></div>
        <div id="hs-mirror" class="hotspot" onclick="clickMirror()" title="대형 거울"></div>
        <div id="hs-portrait-right" class="hotspot" onclick="clickPortrait()" title="초상화"></div>
        <div id="hs-clock" class="hotspot" onclick="clickClock()" title="할아버지 시계"></div>
        <div id="hs-door" class="hotspot" onclick="clickDoor()" title="현관문"></div>

        <!-- UI -->
        <div id="ui-layer">
            <div id="textbox">저택 문이 잠겼습니다. 방 안이 어둡고 싸늘합니다. 우선 탁자 위의 촛대에 불을 밝혀보세요. (성냥 선택 후 탁자 클릭)</div>
            <div id="inventory">
                <div class="inv-slot" id="slot-0" onclick="selectItem(0)">🕯️</div>
                <div class="inv-slot" id="slot-1" onclick="selectItem(1)"></div>
                <div class="inv-slot" id="slot-2" onclick="selectItem(2)"></div>
                <div class="inv-slot" id="slot-3" onclick="selectItem(3)"></div>
            </div>
        </div>

        <!-- 팝업 모달: 전화기 -->
        <div id="modal-phone" class="modal">
            <h3>다이얼 전화기</h3>
            <p>4자리 암호를 돌리세요.</p>
            <input type="text" id="phone-input" maxlength="4" placeholder="----">
            <br>
            <button onclick="checkPhone()">번호 입력</button>
            <button onclick="closeModal('modal-phone')">닫기</button>
        </div>

        <!-- 팝업 모달: 시계 기어 퍼즐 -->
        <div id="modal-clock" class="modal">
            <h3>괘종시계 내부 오르골</h3>
            <p>방 안에서 발견한 단서를 조합하여 3개의 기어 순서를 배치하세요.</p>
            <input type="text" id="clock-input" maxlength="3" placeholder="---">
            <br>
            <button onclick="checkClock()">기어 작동</button>
            <button onclick="closeModal('modal-clock')">닫기</button>
        </div>

        <!-- 팝업 모달: 현관문 자물쇠 -->
        <div id="modal-door" class="modal">
            <h3>현관문 복합 자물쇠</h3>
            <p>3자리 암호를 입력하고 열쇠를 사용하세요.</p>
            <input type="text" id="door-input" maxlength="3" placeholder="---">
            <br>
            <button onclick="checkDoor()">잠금 해제</button>
            <button onclick="closeModal('modal-door')">닫기</button>
        </div>

        <!-- 엔딩 화면 -->
        <div id="ending-screen">
            <h1>ESCAPE SUCCESS</h1>
            <p style="font-size: 16px; margin-bottom: 10px;">모든 퍼즐을 풀고 저택을 무사히 탈출하셨습니다!</p>
            <p style="font-size: 13px; color: #aaa;">자정을 알리는 종소리가 밤하늘에 메아리칩니다...</p>
            <button style="margin-top: 25px;" onclick="location.reload()">다시 도전하기</button>
        </div>
    </div>

    <script>
        let gameState = {
            isLit: false,
            hasDiary: false,
            portraitUncovered: false,
            phoneSolved: false,
            clockKeyObtained: false,
            clockWound: false,
            clockSolved: false,
            doorKeyObtained: false,
            selectedItemIndex: null,
            inventory: ['성냥', '', '', '']
        };

        const itemIcons = {
            '성냥': '🕯️',
            '암호일기': '📜',
            '천': '🧵',
            '시계열쇠': '🔑',
            '문열쇠': '🗝️'
        };

        function updateInventoryUI() {
            for (let i = 0; i < 4; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const itemName = gameState.inventory[i];
                slot.innerText = itemName ? itemIcons[itemName] || '📦' : '';
            }
        }

        function log(message) {
            document.getElementById('textbox').innerText = message;
        }

        function selectItem(index) {
            if (!gameState.inventory[index]) return;

            if (gameState.selectedItemIndex === index) {
                gameState.selectedItemIndex = null;
                document.getElementById(`slot-${index}`).classList.remove('selected');
            } else {
                if (gameState.selectedItemIndex !== null) {
                    document.getElementById(`slot-${gameState.selectedItemIndex}`).classList.remove('selected');
                }
                gameState.selectedItemIndex = index;
                document.getElementById(`slot-${index}`).classList.add('selected');
                log(`'${gameState.inventory[index]}'을(를) 선택했습니다.`);
            }
        }

        function getSelectedItem() {
            if (gameState.selectedItemIndex === null) return null;
            return gameState.inventory[gameState.selectedItemIndex];
        }

        function removeItem(itemName) {
            const idx = gameState.inventory.indexOf(itemName);
            if (idx !== -1) {
                gameState.inventory[idx] = '';
                if (gameState.selectedItemIndex === idx) {
                    document.getElementById(`slot-${idx}`).classList.remove('selected');
                    gameState.selectedItemIndex = null;
                }
                updateInventoryUI();
            }
        }

        function addItem(itemName) {
            for (let i = 0; i < 4; i++) {
                if (!gameState.inventory[i]) {
                    gameState.inventory[i] = itemName;
                    updateInventoryUI();
                    return true;
                }
            }
            return false;
        }

        // 1. 탁자 (불 붙이기 & 전화기)
        function clickTable() {
            if (!gameState.isLit) {
                if (getSelectedItem() === '성냥') {
                    gameState.isLit = true;
                    document.getElementById('darkness-overlay').classList.add('lit');
                    removeItem('성냥');
                    log("성냥으로 촛대에 불을 붙였습니다! 촛불의 온기가 퍼지며 방 전체가 따뜻하고 화사하게 밝아집니다.");
                } else {
                    log("탁자 위 촛대가 보입니다. 불을 밝혀야 세부 단서들을 조사할 수 있습니다.");
                }
                return;
            }

            openModal('modal-phone');
        }

        // 2. 벽난로
        function clickFireplace() {
            if (!gameState.isLit) return log("불을 켜기 전이라 벽난로 안이 너무 어둡습니다.");

            if (!gameState.hasDiary) {
                gameState.hasDiary = true;
                addItem('암호일기');
                log("벽난로 재 속에서 '암호일기' 조각을 찾았습니다! 글자가 뒤집혀 있어서 그대로는 읽을 수 없습니다.");
            } else {
                log("식어있는 벽난로입니다. 더 이상 특별한 것은 없습니다.");
            }
        }

        // 3. 오른쪽 초상화
        function clickPortrait() {
            if (!gameState.isLit) return log("불을 켜야 초상화를 자세히 볼 수 있습니다.");

            if (!gameState.portraitUncovered) {
                gameState.portraitUncovered = true;
                addItem('천');
                log("초상화의 천을 치웠습니다. ('천' 획득) 인물이 대형 거울을 노려보고 있으며, 아래에 '기어 순서 힌트: 큰 것부터 작은 것으로'라는 각인이 있습니다.");
            } else {
                log("초상화 각인: [기어 순서 힌트: 큰 기어부터 작은 기어 순으로]. 시선은 거울을 향하고 있습니다.");
            }
        }

        // 4. 대형 거울
        function clickMirror() {
            if (!gameState.isLit) return log("불을 켜야 거울 표면이 비쳐 보입니다.");

            if (getSelectedItem() === '암호일기') {
                log("거울에 '암호일기'를 비춰보니 뒤집힌 암호가 바르게 보입니다! -> [저택 창건 연도: 1880]");
            } else if (gameState.hasDiary) {
                log("거울에 무언가를 비춰볼 수 있을 것 같습니다. '암호일기'를 선택하고 거울을 눌러보세요.");
            } else {
                log("오래된 거울입니다. 뒤집힌 글씨나 물건을 비춰보기에 적합해 보입니다.");
            }
        }

        // 전화기 입력 (1880)
        function checkPhone() {
            const val = document.getElementById('phone-input').value;
            if (val === '1880') {
                gameState.phoneSolved = true;
                closeModal('modal-phone');
                log("전화기 수화기에서 목소리가 들립니다: '시간을 움직이려거든 기어를 3번, 1번, 2번 크기 순으로 맞추라...' 전화기 밑에서 '시계열쇠'를 얻었습니다.");
                if (!gameState.clockKeyObtained) {
                    addItem('시계열쇠');
                    gameState.clockKeyObtained = true;
                }
            } else {
                log("치-익... 아무 소리도 안 들립니다. (일기장의 암호를 거울에 비춰 해석해보세요)");
            }
        }

        // 5. 할아버지 시계
        function clickClock() {
            if (!gameState.isLit) return log("불을 켜야 시계 장치가 보입니다.");

            if (!gameState.clockWound) {
                if (getSelectedItem() === '시계열쇠') {
                    gameState.clockWound = true;
                    removeItem('시계열쇠');
                    log("시계 태엽을 감았습니다. 이제 내부 오르골의 기어 순서 3자리를 입력하세요.");
                    openModal('modal-clock');
                } else {
                    log("멈춘 시계입니다. 태엽을 감을 열쇠가 필요합니다. (전화기 퍼즐을 풀어보세요)");
                }
            } else {
                openModal('modal-clock');
            }
        }

        // 시계 기어 검증 (312)
        function checkClock() {
            const val = document.getElementById('clock-input').value;
            if (val === '312') {
                gameState.clockSolved = true;
                closeModal('modal-clock');
                log("댕- 댕- 댕-! 오르골이 작동하며 시계가 자정(12:00)을 알립니다. 시계 하단에서 '문열쇠'가 떨어졌으며 희미하게 [현관 암호: 246] 소리가 들립니다!");
                if (!gameState.doorKeyObtained) {
                    addItem('문열쇠');
                    gameState.doorKeyObtained = true;
                }
            } else {
                log("기어가 맞물리지 않고 덜컥거립니다. (힌트: 초상화 각인의 크기 조건과 전화기 음성의 숫자를 조합해보세요)");
            }
        }

        // 6. 현관문
        function clickDoor() {
            if (!gameState.clockSolved) {
                log("굳게 잠긴 이중 나무문입니다. 시계 퍼즐을 풀어 탈출 단서를 획득하세요.");
                return;
            }

            openModal('modal-door');
        }

        // 현관문 최종 풀이 (246)
        function checkDoor() {
            const val = document.getElementById('door-input').value;
            if (val === '246') {
                if (getSelectedItem() === '문열쇠' || gameState.doorKeyObtained) {
                    closeModal('modal-door');
                    document.getElementById('ending-screen').style.display = 'flex';
                } else {
                    log("암호는 맞지만, 문열쇠를 인벤토리에서 선택한 후 시도해야 합니다.");
                }
            } else {
                log("자물쇠 암호가 틀렸습니다.");
            }
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        updateInventoryUI();
    </script>
</body>

</html>
